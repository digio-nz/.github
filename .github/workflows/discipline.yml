# The org ruleset runs this workflow on product repositories.
# The public workflow repository runs its gates through check-discipline.yml.
# Every gate is advisory and continues on error, except no-secret, which still blocks:
# a credential-shaped value in any commit fails Discipline and holds the merge.
# Failed advisory gates show as warnings, in the job summary and in a sticky PR comment.
name: Discipline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled]
  merge_group:

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  discipline:
    name: Discipline
    if: github.repository != 'digio-nz/.github' && (github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, digio-orchestration]
    timeout-minutes: 15
    steps:
      - name: Read the PR live from the API
        continue-on-error: true
        id: pr
        uses: digio-nz/.github/.github/actions/discipline/read-pr@main
      - name: Check out the commit that the event names
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node
        id: node
        continue-on-error: true
        uses: actions/setup-node@v7
        with:
          node-version: "*"
      - name: Fetch the range the gates read
        continue-on-error: true
        id: range
        uses: digio-nz/.github/.github/actions/discipline/fetch-range@main
        with:
          base: ${{ steps.pr.outputs.base }}
          head: ${{ steps.pr.outputs.head }}
      - name: The PR title is a conventional commit title
        id: pr-title
        continue-on-error: true
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        uses: digio-nz/.github/.github/actions/discipline/pr-title@main
      - name: The PR carries a closing keyword or a No issue line
        id: closing-keyword
        continue-on-error: true
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        uses: digio-nz/.github/.github/actions/discipline/closing-keyword@main
      - name: The diff changes no hand-edited version or changelog
        id: no-hand-version
        continue-on-error: true
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        uses: digio-nz/.github/.github/actions/discipline/no-hand-version@main
        with:
          base: ${{ steps.pr.outputs.base }}
          head: ${{ steps.pr.outputs.head }}
      - name: New migrations use a 14-digit timestamp prefix
        id: migrations
        continue-on-error: true
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        uses: digio-nz/.github/.github/actions/discipline/migrations@main
        with:
          base: ${{ steps.pr.outputs.base }}
          head: ${{ steps.pr.outputs.head }}
      - name: Append-only records are not rewritten
        id: append-only
        continue-on-error: true
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        uses: digio-nz/.github/.github/actions/discipline/append-only@main
        with:
          base: ${{ steps.pr.outputs.base }}
          head: ${{ steps.pr.outputs.head }}
      - name: No commit adds a credential-shaped value
        id: no-secret
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        uses: digio-nz/.github/.github/actions/discipline/no-secret@main
        with:
          base: ${{ steps.pr.outputs.base }}
          head: ${{ steps.pr.outputs.head }}
      - name: Workflows parse and lint clean
        id: actionlint
        continue-on-error: true
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        uses: digio-nz/.github/.github/actions/discipline/actionlint@main
      - name: A user-visible change ships its docs
        id: user-docs
        continue-on-error: true
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        uses: digio-nz/.github/.github/actions/discipline/user-docs@main
        with:
          base: ${{ steps.pr.outputs.base }}
          head: ${{ steps.pr.outputs.head }}
          ui-dirs: ${{ vars.DISCIPLINE_UI_DIRS }}
          docs-dir: ${{ vars.DISCIPLINE_DOCS_DIR }}
      - name: Report failed gates (non-blocking)
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          node -e '
            const steps = JSON.parse(process.env.STEPS);
            const failed = Object.entries(steps).filter(([, s]) => s.outcome === "failure").map(([id]) => id);
            const fs = require("fs");
            const lines = failed.length
              ? ["### Discipline: " + failed.length + " gate(s) failed (advisory)", "", ...failed.map((id) => "- `" + id + "`"), "", "Discipline does not block the merge. Read the failed steps above."]
              : ["### Discipline: all gates passed"];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            for (const id of failed) console.log("::warning title=Discipline::Gate " + id + " failed. Discipline is advisory and does not block the merge.");
          '

      - name: Post the gate results as a sticky PR comment
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          STEPS: ${{ toJSON(steps) }}
        with:
          script: |
            const marker = "<!-- discipline: advisory-report -->";
            const steps = JSON.parse(process.env.STEPS);
            const failed = Object.entries(steps).filter(([, s]) => s.outcome === "failure").map(([id]) => id);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = failed.length
              ? [marker, `### :warning: Discipline: ${failed.length} gate(s) failed on ${sha}`, "", ...failed.map((id) => `- \`${id}\``), "", `Discipline is advisory and does not block the merge. Fix the gates or say why they do not apply. [Run log](${run})`].join("\n")
              : [marker, `### :white_check_mark: Discipline: all gates passed on ${sha}`, "", `[Run log](${run})`].join("\n");
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else if (failed.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }

  labels:
    name: Label the PR
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || contains(fromJSON('["Task","Bug","Plan","Phase"]'), github.event.label.name))
    concurrency:
      group: pr-labels-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ${{ vars.PROCESS_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Read the PR live from the API
        id: pr
        uses: digio-nz/.github/.github/actions/discipline/read-pr@main
      - name: Check out the commit that the event names
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "*"
      - name: Fetch the range the labeller reads
        uses: digio-nz/.github/.github/actions/discipline/fetch-range@main
        with:
          base: ${{ steps.pr.outputs.base }}
          head: ${{ steps.pr.outputs.head }}
      - name: Label the PR (pr-labeller apply)
        uses: digio-nz/.github/.github/actions/discipline/pr-labels-apply@c958140b60c7de4679e5a56efa366465ce3c8197
        with:
          repo: ${{ github.repository }}
          number: ${{ steps.pr.outputs.number }}
          skills-read-token: ${{ secrets.DIGIO_SKILLS_READ_TOKEN }}
          reader-app-id: ${{ vars.READER_APP_ID }}
          reader-app-private-key: ${{ secrets.READER_APP_PRIVATE_KEY }}
