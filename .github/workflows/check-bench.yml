name: Check Bench
on:
  pull_request:
    paths: ["bench/**", ".github/workflows/check-bench.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench:
    name: Build and Self-Test
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The compose file requires these for test-agent, which this job does not start.
      DIGIO_SKILLS_ROOT: /nonexistent/digio-skills
      DIGIO_MICHELIN_ROOT: /nonexistent/digio-michelin
    steps:
      - name: Check Out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Self-Test the Start of test-agent
        shell: bash
        run: bash bench/scripts/test-agent-start-selftest.sh
      - name: Self-Test the Runner of test-agent
        shell: bash
        run: bash bench/scripts/test-agent-run-selftest.sh
      - name: Start test-browser
        shell: bash
        run: docker compose -f bench/compose.yaml up -d --build --wait test-browser
      - name: Name test-browser on the Runner
        shell: bash
        run: |
          # The MCP server answers a call by the name test-browser only, so the runner needs that name.
          id="$(docker compose -f bench/compose.yaml ps -q test-browser)"
          address="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$id")"
          [ -n "$address" ] || { echo "FAIL: test-browser has no address on the network of the bench" >&2; exit 1; }
          echo "$address test-browser" | sudo tee -a /etc/hosts
      - name: Self-Test test-browser
        shell: bash
        run: bash bench/scripts/test-browser-selftest.sh http://test-browser:6080 http://test-browser:8931/mcp
      - name: Check That the Video Is in the Output Folder
        shell: bash
        run: |
          docker compose -f bench/compose.yaml exec -T test-browser test -s /home/browser/data/output/selftest.webm \
            || { echo "FAIL: test-browser has no video /home/browser/data/output/selftest.webm after the self-test" >&2; docker compose -f bench/compose.yaml exec -T test-browser ls -la /home/browser/data/output >&2; exit 1; }
      - name: Check That a Call by Another Name Is Refused
        shell: bash
        run: |
          address="$(awk '$2 == "test-browser" {print $1}' /etc/hosts)"
          code="$(curl -s -o /dev/null -w '%{http_code}' -m 10 -X POST "http://$address:8931/mcp" -H 'content-type: application/json' -d '{}')"
          [ "$code" = 403 ] || { echo "FAIL: the MCP server answered $code, not 403, to a call by its address" >&2; exit 1; }
      - name: Check That a Wrong Bypass Rule Stops the Start
        shell: bash
        run: |
          # refused <what> <text of the fault> <value of TEST_BROWSER_BYPASS>
          refused() {
            local out
            if out="$(docker run --rm -e "TEST_BROWSER_BYPASS=$3" test-browser 2>&1)"; then
              echo "FAIL: test-browser started with $1" >&2; exit 1
            fi
            grep -Fq "$2" <<< "$out" || { echo "FAIL: the start with $1 did not name the fault: $out" >&2; exit 1; }
            ! grep -Fq "selftest-secret" <<< "$out" || { echo "FAIL: the start with $1 printed the secret" >&2; exit 1; }
          }
          refused "a bypass secret and no host" "has no '='" "selftest-secret"
          refused "a bypass host and no secret" "has no secret" "product-*-team.vercel.app="
          refused "a bypass host that names each Vercel site" "is not a host name" "*.vercel.app=selftest-secret"
          refused "one good rule and one wrong rule" "is not a host name" "product-*-team.vercel.app=selftest-secret,*.vercel.app=selftest-secret"
      - name: Print the Log of test-browser
        if: failure()
        shell: bash
        run: docker compose -f bench/compose.yaml logs test-browser
