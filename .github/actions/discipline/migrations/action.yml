name: migrations
description: New migrations use a 14-digit timestamp prefix
inputs:
  base:
    required: true
  head:
    required: true
runs:
  using: composite
  steps:
    - name: New migrations use a 14-digit timestamp prefix
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
      run: |
        set -euo pipefail
        bash "$GITHUB_ACTION_PATH/../gates.sh" migrations "$BASE" "$HEAD"
