# Trusted Preview provisioning: no PR checkout, dependency install or Production write.
# The shared action refuses a copy of this file that differs from its own, apart from the action pin.
name: Preview provision

on:
  workflow_run:
    workflows: [CI, Standing Preview]
    types: [completed]
  workflow_dispatch:
    inputs:
      selector:
        description: "pr:<number> or standing-preview"
        required: true
        default: standing-preview

permissions:
  contents: read

concurrency:
  group: preview-provision-${{ github.event_name == 'workflow_dispatch' && inputs.selector || github.event.workflow_run.path == '.github/workflows/ci.yml' && format('branch:{0}', github.event.workflow_run.head_branch) || 'standing-preview' }}
  cancel-in-progress: false

jobs:
  provision:
    # The provisioner proves CI through the API; these conditions only skip events that cannot qualify.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((github.event.workflow_run.path == '.github/workflows/standing-preview.yml' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main') ||
      (github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login != 'dependabot[bot]' &&
      !startsWith(github.event.workflow_run.head_branch, 'dependabot/')))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview-provision
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Provision and deploy Preview
        uses: digio-nz/.github/.github/actions/preview-provision@0000000000000000000000000000000000000000
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEON_PREVIEW_API_KEY: ${{ secrets.NEON_PREVIEW_API_KEY }}
          VERCEL_PREVIEW_TOKEN: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
        with:
          mode: apply
          selector: ${{ github.event_name == 'workflow_dispatch' && inputs.selector || github.event.workflow_run.path == '.github/workflows/ci.yml' && format('ci-run:{0}', github.event.workflow_run.id) || github.event.workflow_run.path == '.github/workflows/standing-preview.yml' && 'standing-preview' || 'no-selector' }}
